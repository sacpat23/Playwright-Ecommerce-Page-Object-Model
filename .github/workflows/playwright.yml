name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ECOM_USERNAME: ${{ secrets.ECOM_USERNAME }}
      ECOM_PASSWORD: ${{ secrets.ECOM_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-ecommerce .

      - name: Run Playwright tests in Docker
        run: docker run --rm -e ECOM_USERNAME -e ECOM_PASSWORD playwright-ecommerce

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30
